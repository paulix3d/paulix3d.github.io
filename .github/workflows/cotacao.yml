{"name":"cotacao","on":{"schedule":[{"cron":"0 */3 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"u":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"s=$(date -d '-10 days' +%m-%d-%Y); e=$(date +%m-%d-%Y); r=$(curl -fsS \"https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)?@dataInicial='$s'&@dataFinalCotacao='$e'&%24orderby=dataHoraCotacao%20desc&%24top=1&%24format=json\"); v=$(echo \"$r\" | jq -r '.value[0].cotacaoVenda' | awk '{printf \"%.2f\",$1}' | tr . ,); d=$(echo \"$r\" | jq -r '.value[0].dataHoraCotacao' | awk '{split($1,a,\"-\"); print a[3]\"/\"a[2]\"/\"a[1]\" \"substr($2,1,5)}'); echo \"valor=$v data=$d\"; case \"$v\" in [0-9],[0-9][0-9]) echo \"{\\\"usd\\\":\\\"$v\\\",\\\"date\\\":\\\"$d\\\",\\\"source\\\":\\\"PTAX Banco Central\\\"}\" > cotacao.json; git config user.name bot; git config user.email bot@users.noreply.github.com; git add cotacao.json; git diff --cached --quiet || { git commit -m cotacao; git push; };; *) echo sem-valor; exit 1;; esac"}]}}}
