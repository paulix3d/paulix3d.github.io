{"name":"cotacao","on":{"schedule":[{"cron":"0 */3 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"u":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"v=$(curl -s -A 'Mozilla/5.0' https://www.comprasparaguai.com.br/historico-cotacao/ | grep -oP 'Dólar hoje:</span><strong[^>]*>R[$][^0-9]*\\K[0-9,]+' | head -1); echo \"valor=$v\"; if [ -n \"$v\" ]; then echo \"{\\\"usd\\\":\\\"$v\\\",\\\"date\\\":\\\"$(TZ=America/Cuiaba date '+%d/%m/%Y %H:%M')\\\"}\" > cotacao.json; git config user.name bot; git config user.email bot@users.noreply.github.com; git add cotacao.json; git diff --cached --quiet || { git commit -m cotacao; git push; }; else echo sem-valor; exit 1; fi"}]}}}
